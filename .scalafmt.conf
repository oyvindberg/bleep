version=3.11.5
maxColumn = 160
rewrite.rules = [SortImports, RedundantBraces, RedundantParens, PreferCurlyFors]
project.excludePaths = [
  "glob:**/snapshot-tests/**",
  "glob:**/snapshot-tests-in/**",
  # Liberated zinc tracks sbt/zinc closely and is meant to be merged from (and back to) upstream.
  # Reformatting it to bleep's style rewrites ~100 untouched files, which turns every
  # `git merge origin-original` into a conflict and buries real changes in cosmetic diff.
  # Keep it byte-identical to upstream except where we actually change behaviour.
  "glob:**/liberated/zinc/**",
]
runner.dialect = scala3
