version=3.11.5
maxColumn = 160
rewrite.rules = [SortImports, RedundantBraces, RedundantParens, PreferCurlyFors]
project.excludePaths = [
  "glob:**/snapshot-tests/**",
  "glob:**/snapshot-tests-in/**",
  # vendored as-is from bleep-build/zinc, which follows zinc's own formatting: reformatting it would turn every upstream merge into conflicts
  "glob:**/liberated/zinc/**",
]
runner.dialect = scala3
