    - feign-soap
    extends: template-java-25-user.language
    folder: ../maven-build/soap
  feign-spring:
    dependencies: org.springframework:spring-web:7.0.9
    dependsOn: feign-core
    extends: template-java-17
    folder: ../maven-build/spring
