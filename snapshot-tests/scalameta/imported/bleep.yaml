$schema: https://raw.githubusercontent.com/oyvindberg/bleep/master/schema.json
$version: dev
projects:
  bench:
    dependencies:
    - org.openjdk.jmh:jmh-core:1.37
    - org.openjdk.jmh:jmh-generator-bytecode:1.37
    - org.openjdk.jmh:jmh-generator-reflection:1.37
    dependsOn: testssemanticdb
    extends:
    - template-common-main
    - template-cross-jvm-211-212-213
    - template-scala-2-jvm-protobuf
    folder: ../sbt-build/bench/suite
    sourcegen:
      main: scripts.GenerateForBench
      project: scripts
  common:
    cross:
      js212:
        dependencies:
        - com.lihaoyi::sourcecode:0.4.2
        - forceJvm: true
          module: org.scala-js::scalajs-scalalib:${SCALA_VERSION}+${PLATFORM_VERSION}
      js213:
        dependencies:
        - com.lihaoyi::sourcecode:0.4.2
        - forceJvm: true
          module: org.scala-js::scalajs-scalalib:${SCALA_VERSION}+${PLATFORM_VERSION}
      jvm211:
        dependencies: com.lihaoyi::sourcecode:0.3.1
      jvm212:
        dependencies: com.lihaoyi::sourcecode:0.4.2
      jvm213:
        dependencies: com.lihaoyi::sourcecode:0.4.2
      native212:
        dependencies: com.lihaoyi::sourcecode:0.4.2
      native213:
        dependencies: com.lihaoyi::sourcecode:0.4.2
    dependencies:
      configuration: provided
      module: org.scala-lang:scala-reflect:${SCALA_VERSION}
    extends:
    - template-common-cross-full
    - template-common-main
    - template-cross-js-all-jvm-211-212-213-native-all
    folder: ../sbt-build/scalameta/common
    sourcegen:
      main: scripts.GenerateForCommon
      project: scripts
  communitytest:
    cross:
      jvm211:
        dependencies: org.scalameta::munit:1.0.0-M10
      jvm212:
        dependencies: org.scalameta::munit:1.1.0
      jvm213:
        dependencies: org.scalameta::munit:1.1.0
    dependsOn: scalameta
    extends:
    - template-common-main
    - template-cross-jvm-211-212-213
    - template-scala-2-jvm-protobuf
    folder: ../sbt-build/community-test
  communitytest-test:
    dependsOn: communitytest
    extends:
    - template-cross-jvm-211-212-213
    - template-scala-2-jvm-protobuf
    folder: ../sbt-build/community-test
    isTestProject: true
    sbt-scope: test
  io:
    cross:
      js212:
        dependencies:
          forceJvm: true
          module: org.scala-js::scalajs-scalalib:${SCALA_VERSION}+${PLATFORM_VERSION}
      js213:
        dependencies:
          forceJvm: true
          module: org.scala-js::scalajs-scalalib:${SCALA_VERSION}+${PLATFORM_VERSION}
    extends:
    - template-common-cross-full
    - template-common-main
    - template-cross-js-all-jvm-211-212-213-native-all
    folder: ../sbt-build/scalameta/io
  metac:
    dependsOn: semanticdb-scalac-core
    extends:
    - template-common-main
    - template-cross-jvm-full-all
    - template-scala-2-jvm-protobuf
    folder: ../sbt-build/semanticdb/metac
  parsers:
    cross:
      js212:
        dependencies:
        - configuration: provided
          module: org.scala-lang:scala-compiler:${SCALA_VERSION}
        - configuration: provided
          module: org.scala-lang:scala-reflect:${SCALA_VERSION}
        sources:
        - ../quasiquotes/shared/src/${SCOPE}/scala-2
        - ../transversers/${PLATFORM}/src/${SCOPE}/scala
        - ../transversers/shared/src/${SCOPE}/scala
        - ../transversers/shared/src/${SCOPE}/scala-${SCALA_BIN_VERSION}
        - ../transversers/shared/src/${SCOPE}/scala-2
      js213:
        dependencies:
        - configuration: provided
          module: org.scala-lang:scala-compiler:${SCALA_VERSION}
        - configuration: provided
          module: org.scala-lang:scala-reflect:${SCALA_VERSION}
        sources:
        - ../quasiquotes/shared/src/${SCOPE}/scala-2
        - ../transversers/${PLATFORM}/src/${SCOPE}/scala
        - ../transversers/shared/src/${SCOPE}/scala
        - ../transversers/shared/src/${SCOPE}/scala-${SCALA_BIN_VERSION}
        - ../transversers/shared/src/${SCOPE}/scala-2
      jvm211:
        dependencies:
        - configuration: provided
          module: org.scala-lang:scala-compiler:${SCALA_VERSION}
        - configuration: provided
          module: org.scala-lang:scala-reflect:${SCALA_VERSION}
        sources:
        - ../quasiquotes/shared/src/${SCOPE}/scala-2
        - ../transversers/${PLATFORM}/src/${SCOPE}/scala
        - ../transversers/shared/src/${SCOPE}/scala
        - ../transversers/shared/src/${SCOPE}/scala-${SCALA_BIN_VERSION}
        - ../transversers/shared/src/${SCOPE}/scala-2
      jvm212:
        dependencies:
        - configuration: provided
          module: org.scala-lang:scala-compiler:${SCALA_VERSION}
        - configuration: provided
          module: org.scala-lang:scala-reflect:${SCALA_VERSION}
        sources:
        - ../quasiquotes/shared/src/${SCOPE}/scala-2
        - ../transversers/${PLATFORM}/src/${SCOPE}/scala
        - ../transversers/shared/src/${SCOPE}/scala
        - ../transversers/shared/src/${SCOPE}/scala-${SCALA_BIN_VERSION}
        - ../transversers/shared/src/${SCOPE}/scala-2
      jvm213:
        dependencies:
        - configuration: provided
          module: org.scala-lang:scala-compiler:${SCALA_VERSION}
        - configuration: provided
          module: org.scala-lang:scala-reflect:${SCALA_VERSION}
        sources:
        - ../quasiquotes/shared/src/${SCOPE}/scala-2
        - ../transversers/${PLATFORM}/src/${SCOPE}/scala
        - ../transversers/shared/src/${SCOPE}/scala
        - ../transversers/shared/src/${SCOPE}/scala-${SCALA_BIN_VERSION}
        - ../transversers/shared/src/${SCOPE}/scala-2
      jvm3:
        extends:
        - template-jvm
        - template-scala-2.13-and-3.3.6
        scala:
          options: -Wconf:cat=deprecation:silent
          version: 3.3.6
      native212:
        dependencies:
        - configuration: provided
          module: org.scala-lang:scala-compiler:${SCALA_VERSION}
        - configuration: provided
          module: org.scala-lang:scala-reflect:${SCALA_VERSION}
        sources:
        - ../quasiquotes/shared/src/${SCOPE}/scala-2
        - ../transversers/${PLATFORM}/src/${SCOPE}/scala
        - ../transversers/shared/src/${SCOPE}/scala
        - ../transversers/shared/src/${SCOPE}/scala-${SCALA_BIN_VERSION}
        - ../transversers/shared/src/${SCOPE}/scala-2
      native213:
        dependencies:
        - configuration: provided
          module: org.scala-lang:scala-compiler:${SCALA_VERSION}
        - configuration: provided
          module: org.scala-lang:scala-reflect:${SCALA_VERSION}
        sources:
        - ../quasiquotes/shared/src/${SCOPE}/scala-2
        - ../transversers/${PLATFORM}/src/${SCOPE}/scala
        - ../transversers/shared/src/${SCOPE}/scala
        - ../transversers/shared/src/${SCOPE}/scala-${SCALA_BIN_VERSION}
        - ../transversers/shared/src/${SCOPE}/scala-2
    dependsOn: trees
    extends:
    - template-common-cross-full
    - template-common-main
    - template-cross-js-all-jvm-211-212-213-native-all
    folder: ../sbt-build/scalameta/parsers
    sourcegen:
      main: scripts.GenerateForParsers
      project: scripts
    sources:
    - ../quasiquotes/${PLATFORM}/src/${SCOPE}/scala
    - ../quasiquotes/shared/src/${SCOPE}/scala
    - ../quasiquotes/shared/src/${SCOPE}/scala-${SCALA_BIN_VERSION}
  scala3treeliftscodegen:
    dependsOn: scala3treeliftsmacro
    extends:
    - template-common-main
    - template-scala-2-jvm-protobuf
    - template-scala-2.13.16
    folder: ../sbt-build/scala3-tree-lifts/impl
    ignoreEvictionErrors: no
    publish:
      groupId: scala3treeliftscodegen
  scala3treeliftsmacro:
    dependencies:
      configuration: provided
      module: org.scala-lang:scala-reflect:${SCALA_VERSION}
    dependsOn: trees
    extends:
    - template-common-main
    - template-scala-2-jvm-protobuf
    - template-scala-2.13.16
    folder: ../sbt-build/scala3-tree-lifts/macro
    ignoreEvictionErrors: no
    publish:
      groupId: scala3treeliftsmacro
  scalameta:
    cross:
      js212:
        sources: ../contrib/shared/src/${SCOPE}/scala-2
      js213:
        sources: ../contrib/shared/src/${SCOPE}/scala-2
      jvm211:
        sources: ../contrib/shared/src/${SCOPE}/scala-2
      jvm212:
        sources: ../contrib/shared/src/${SCOPE}/scala-2
      jvm213:
        sources: ../contrib/shared/src/${SCOPE}/scala-2
      jvm3:
        extends:
        - template-jvm
        - template-scala-2.13-and-3.3.6
        scala:
          options: -Wconf:cat=deprecation:silent
          version: 3.3.6
      native212:
        sources: ../contrib/shared/src/${SCOPE}/scala-2
      native213:
        sources: ../contrib/shared/src/${SCOPE}/scala-2
    dependsOn: parsers
    extends:
    - template-common-cross-full
    - template-common-main
    - template-cross-js-all-jvm-211-212-213-native-all
    folder: ../sbt-build/scalameta/scalameta
    sources:
    - ../contrib/${PLATFORM}/src/${SCOPE}/scala
    - ../contrib/shared/src/${SCOPE}/scala
    - ../contrib/shared/src/${SCOPE}/scala-${SCALA_BIN_VERSION}
  scalameta-docs:
    dependencies: org.scalameta::mdoc:2.7.1
    extends:
    - template-common-main
    - template-scala-2-jvm-protobuf
    - template-scala-2.13-wconf
    - template-scala-2.13.16
    folder: ../sbt-build/scalameta-docs
    sourcegen:
      main: scripts.GenerateForScalametaDocs
      project: scripts
  scripts:
    dependencies: build.bleep::bleep-core:0.0.12
    platform:
      name: jvm
    scala:
      version: 3.9.0
  semanticdb-metacp:
    dependsOn: semanticdb-scalac-core
    extends:
    - template-common-main
    - template-cross-jvm-full-all
    - template-scala-2-jvm-protobuf
    folder: ../sbt-build/semanticdb/metacp
  semanticdb-metap:
    dependsOn: semanticdb-shared
    extends:
    - template-common-main
    - template-cross-jvm-full-all
    - template-scala-2-jvm-protobuf
    folder: ../sbt-build/semanticdb/metap
  semanticdb-scalac:
    dependsOn: semanticdb-scalac-core
    extends:
    - template-common-main
    - template-cross-jvm-full-all
    - template-scala-2-jvm-protobuf
    folder: ../sbt-build/semanticdb/scalac/plugin
  semanticdb-scalac-core:
    dependencies: org.scala-lang:scala-compiler:${SCALA_VERSION}
    dependsOn: semanticdb-shared
    extends:
    - template-common-main
    - template-cross-jvm-full-all
    - template-scala-2-jvm-protobuf
    folder: ../sbt-build/semanticdb/scalac/library
  semanticdb-shared:
    cross:
      js212:
        dependencies: com.thesamet.scalapb::scalapb-runtime:0.11.17
      js213:
        dependencies: com.thesamet.scalapb::scalapb-runtime:0.11.17
      jvm211:
        dependencies: com.thesamet.scalapb::scalapb-runtime:0.9.8
      jvm212:
        dependencies: com.thesamet.scalapb::scalapb-runtime:0.11.17
      jvm213:
        dependencies: com.thesamet.scalapb::scalapb-runtime:0.11.17
      native212:
        dependencies: com.thesamet.scalapb::scalapb-runtime:0.11.17
      native213:
        dependencies: com.thesamet.scalapb::scalapb-runtime:0.11.17
    dependencies: org.scala-lang:scalap:${SCALA_VERSION}
    dependsOn: scalameta
    extends:
    - template-common-main
    - template-cross-js-all-jvm-211-212-213-native-all
    folder: ../sbt-build/semanticdb/semanticdb
    resources:
    - ./shared/src/${SCOPE}/proto
    - ./shared/src/${SCOPE}/proto/semanticdb.proto
    - ./shared/src/${SCOPE}/proto/semanticidx.proto
    source-layout: cross-full
    sourcegen:
      main: scripts.GenerateForSemanticdbShared
      project: scripts
    sources: ./shared/src/${SCOPE}/proto
  semanticdbintegration:
    cross:
      jvm211:
        extends: template-scala-2.11
        scala:
          options: -Ywarn-unused-import
      jvm212:
        extends: template-scala-2.12.20
        scala:
          options: -Ywarn-unused-import
      jvm213:
        extends:
        - template-scala-2.13
        - template-scala-2.13.16
        scala:
          options: -Wunused:imports -Xsource-features:leading-infix
    dependsOn:
    - semanticdb-scalac
    - semanticdbintegrationmacros
    extends:
    - template-common-main
    - template-scala-2-jvm-protobuf
    folder: ../sbt-build/semanticdb/integration
    java:
      options: -parameters
    scala:
      options: -Yrangepos -deprecation
  semanticdbintegrationmacros:
    dependencies:
      configuration: provided
      module: org.scala-lang:scala-reflect:${SCALA_VERSION}
    extends:
    - template-common-main
    - template-cross-jvm-211-212-213
    - template-scala-2-jvm-protobuf
    folder: ../sbt-build/semanticdb/integration-macros
  testkit:
    cross:
      jvm211:
        dependencies: org.rauschig:jarchivelib:1.2.0
      jvm212:
        dependencies: org.rauschig:jarchivelib:1.2.0
      jvm213:
        dependencies: org.rauschig:jarchivelib:1.2.0
      jvm3:
        dependencies: org.rauschig:jarchivelib:1.2.0
        extends:
        - template-jvm
        - template-scala-2.13-and-3.3.6
        scala:
          options: -Wconf:cat=deprecation:silent
          version: 3.3.6
    dependsOn: scalameta
    extends:
    - template-common-cross-full
    - template-common-main
    - template-cross-js-all-jvm-211-212-213-native-all
    folder: ../sbt-build/scalameta/testkit
  tests:
    cross:
      js212:
        dependencies:
        - for3Use213: true
          forceJvm: true
          module: io.get-coursier::coursier:2.1.24
        - org.scalameta::munit:1.1.0
      js213:
        dependencies:
        - for3Use213: true
          forceJvm: true
          module: io.get-coursier::coursier:2.1.24
        - org.scalameta::munit:1.1.0
      jvm211:
        dependencies:
        - for3Use213: true
          module: io.get-coursier::coursier:2.0.0-RC5-6
        - org.scala-lang:scala-reflect:${SCALA_VERSION}
        - org.scalameta::munit:1.0.0-M10
      jvm212:
        dependencies:
        - for3Use213: true
          forceJvm: true
          module: io.get-coursier::coursier:2.1.24
        - org.scala-lang:scala-reflect:${SCALA_VERSION}
        - org.scalameta::munit:1.1.0
      jvm213:
        dependencies:
        - for3Use213: true
          forceJvm: true
          module: io.get-coursier::coursier:2.1.24
        - org.scala-lang:scala-reflect:${SCALA_VERSION}
        - org.scalameta::munit:1.1.0
      jvm3:
        dependencies:
        - for3Use213: true
          forceJvm: true
          module: io.get-coursier::coursier:2.1.24
        - org.scalameta::munit:1.1.0
      native212:
        dependencies:
        - for3Use213: true
          forceJvm: true
          module: io.get-coursier::coursier:2.1.24
        - org.scalameta::munit:1.1.0
      native213:
        dependencies:
        - for3Use213: true
          forceJvm: true
          module: io.get-coursier::coursier:2.1.24
        - org.scalameta::munit:1.1.0
    dependsOn: testkit
    extends:
    - template-common-cross-full
    - template-common-main
    - template-cross-js-all-jvm-212-213-3-native-all
    - template-cross-jvm-211-212-213
    folder: ../sbt-build/tests
    sourcegen:
      main: scripts.GenerateForTests
      project: scripts
  tests-test:
    cross:
      jvm213:
        dependencies:
        - org.scala-lang.modules::scala-parallel-collections:1.2.0
        - org.scala-lang:scala-compiler:${SCALA_VERSION}
    dependsOn: tests
    extends:
    - template-common-cross-full
    - template-cross-js-all-jvm-212-213-3-native-all
    - template-cross-jvm-211-212-213
    folder: ../sbt-build/tests
    isTestProject: true
    sbt-scope: test
    sources: ./${PLATFORM}/src/${SCOPE}/scala-${SCALA_VERSION}
  testssemanticdb:
    cross:
      jvm211:
        dependencies:
        - for3Use213: true
          module: io.get-coursier::coursier:2.0.0-RC5-6
        - org.scalameta::munit:1.0.0-M10
      jvm212:
        dependencies:
        - for3Use213: true
          module: io.get-coursier::coursier:2.1.24
        - org.scalameta::munit:1.1.0
      jvm213:
        dependencies:
        - for3Use213: true
          module: io.get-coursier::coursier:2.1.24
        - org.scalameta::munit:1.1.0
    dependsOn:
    - metac
    - semanticdb-metacp
    - semanticdb-metap
    - semanticdbintegration
    - testkit
    extends:
    - template-common-main
    - template-cross-jvm-211-212-213
    - template-scala-2-jvm-protobuf
    folder: ../sbt-build/tests-semanticdb
    sourcegen:
      main: scripts.GenerateForTestssemanticdb
      project: scripts
  testssemanticdb-test:
    dependsOn: testssemanticdb
    extends:
    - template-cross-jvm-211-212-213
    - template-scala-2-jvm-protobuf
    folder: ../sbt-build/tests-semanticdb
    isTestProject: true
    sbt-scope: test
    sources: ./src/${SCOPE}/scala-${SCALA_VERSION}
  trees:
    cross:
      js212:
        dependencies: com.lihaoyi::fastparse:3.1.0
      js213:
        dependencies: com.lihaoyi::fastparse:3.1.1
      jvm211:
        dependencies: com.lihaoyi::fastparse:3.0.2
      jvm212:
        dependencies: com.lihaoyi::fastparse:3.1.0
      jvm213:
        dependencies: com.lihaoyi::fastparse:3.1.1
      native212:
        dependencies: com.lihaoyi::fastparse:3.1.0
      native213:
        dependencies: com.lihaoyi::fastparse:3.1.1
    dependencies:
    - configuration: provided
      module: org.scala-lang:scala-compiler:${SCALA_VERSION}
    - configuration: provided
      module: org.scala-lang:scala-reflect:${SCALA_VERSION}
    dependsOn:
    - common
    - io
    extends:
    - template-common-cross-full
    - template-common-main
    - template-cross-js-all-jvm-211-212-213-native-all
    folder: ../sbt-build/scalameta/trees
    sources:
    - ../dialects/${PLATFORM}/src/${SCOPE}/scala
    - ../dialects/shared/src/${SCOPE}/scala
    - ../dialects/shared/src/${SCOPE}/scala-${SCALA_BIN_VERSION}
    - ../dialects/shared/src/${SCOPE}/scala-2
    - ../inputs/${PLATFORM}/src/${SCOPE}/scala
    - ../inputs/shared/src/${SCOPE}/scala
    - ../inputs/shared/src/${SCOPE}/scala-${SCALA_BIN_VERSION}
    - ../inputs/shared/src/${SCOPE}/scala-2
    - ../tokenizers/${PLATFORM}/src/${SCOPE}/scala
    - ../tokenizers/shared/src/${SCOPE}/scala
    - ../tokenizers/shared/src/${SCOPE}/scala-${SCALA_BIN_VERSION}
    - ../tokenizers/shared/src/${SCOPE}/scala-2
    - ../tokens/${PLATFORM}/src/${SCOPE}/scala
    - ../tokens/shared/src/${SCOPE}/scala
    - ../tokens/shared/src/${SCOPE}/scala-${SCALA_BIN_VERSION}
    - ../tokens/shared/src/${SCOPE}/scala-2
templates:
  template-common:
    ignoreEvictionErrors: warn
    scala:
      setup:
        order: mixed
  template-common-cross-full:
    extends: template-common-feature
    resources: ./${PLATFORM}/src/${SCOPE}/protobuf
    source-layout: cross-full
    sources: ./${PLATFORM}/src/${SCOPE}/protobuf
  template-common-feature:
    extends: template-common
    scala:
      options: -feature -unchecked
  template-common-main:
    extends: template-common
    publish:
      groupId: org.scalameta
    sbt-scope: main
  template-cross-js-all-jvm-211-212-213-native-all:
    cross:
      js212:
        extends:
        - template-js
        - template-scala-2.12.20
      js213:
        extends:
        - template-js
        - template-scala-2.13-wconf
        - template-scala-2.13.16
      jvm211:
        extends: template-scala-2.11
      jvm212:
        extends: template-scala-2.12.17
      jvm213:
        extends:
        - template-jvm
        - template-scala-2.13-wconf
        - template-scala-2.13.16
      native212:
        extends:
        - template-native
        - template-scala-2.12.20
      native213:
        extends:
        - template-native
        - template-scala-2.13-wconf
        - template-scala-2.13.16
  template-cross-js-all-jvm-212-213-3-native-all:
    cross:
      js212:
        extends:
        - template-js
        - template-scala-2.12.20
      js213:
        extends:
        - template-js
        - template-scala-2.13-wconf
        - template-scala-2.13.16
      jvm212:
        extends: template-jvm
      jvm213:
        extends: template-jvm
      jvm3:
        extends:
        - template-jvm
        - template-scala-2.13-and-3
        scala:
          options: -Wconf:cat=deprecation:silent -Wconf:msg=pattern binding uses refutable
            extractor:s -Xcheck-macros
          version: 3.7.1
      native212:
        extends:
        - template-native
        - template-scala-2.12.20
      native213:
        extends:
        - template-native
        - template-scala-2.13-wconf
        - template-scala-2.13.16
  template-cross-jvm-211-212-213:
    cross:
      jvm211:
        extends: template-scala-2.11
      jvm212:
        extends: template-scala-2.12.20
      jvm213:
        extends:
        - template-scala-2.13-wconf
        - template-scala-2.13.16
  template-cross-jvm-full-all:
    cross:
      jvm2.11.12:
        extends: template-scala-2.11
        sources: ./src/${SCOPE}/scala-${SCALA_VERSION}
      jvm2.12.17:
        extends: template-scala-2.12.17
        sources: ./src/${SCOPE}/scala-${SCALA_VERSION}
      jvm2.12.18:
        extends: template-scala-2.12.18
      jvm2.12.19:
        extends: template-scala-2.12.19
      jvm2.12.20:
        extends: template-scala-2.12.20
        sources: ./src/${SCOPE}/scala-${SCALA_VERSION}
      jvm2.13.13:
        extends: template-scala-2.13.13
      jvm2.13.14:
        extends: template-scala-2.13.14
      jvm2.13.15:
        extends: template-scala-2.13.15
      jvm2.13.16:
        extends:
