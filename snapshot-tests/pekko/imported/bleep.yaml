templates:
  template-common:
    ignoreEvictionErrors: no
    java:
      options: --release 17
    platform:
      name: jvm
    scala:
      options: -encoding UTF-8 -feature -language:higherKinds -release 17
      setup:
        addLibraryToBootClasspath: false
        filterLibraryFromClasspath: false
        manageBootClasspath: false
        order: mixed
    sources: ./src/${SCOPE}/scala-2.13+
  template-common-main:
    extends: template-common-unchecked
    publish:
      groupId: org.apache.pekko
    sbt-scope: main
  template-common-test:
    extends: template-common
    isTestProject: true
    java:
      options: -Xlint:unchecked -encoding UTF-8
    platform:
      jvmOptions: --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED
        --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
        -Djava.security.egd=file:/dev/urandom -Duser.dir=${PROJECT_DIR} -XX:+PerfDisableSharedMem
        -XX:+UseG1GC -XX:MaxDirectMemorySize=256m -XX:MaxGCPauseMillis=300 -Xms3g
        -Xmx3g -Xss2m
    sbt-scope: test
    testFrameworks:
    - com.github.sbt.junit.jupiter.api.JupiterFramework
    - hedgehog.sbt.Framework
    - weaver.framework.CatsEffect
    - zio.test.sbt.ZTestFramework
  template-common-unchecked:
    extends: template-common
    scala:
      options: -unchecked
  template-cross-all:
    cross:
      jvm213:
        extends:
        - template-scala-2.13-main
        - template-scala-2.13-wconf
      jvm3:
        extends:
        - template-common-main
        - template-scala-3
  template-cross-all-common-unchecked:
    cross:
      jvm213:
        extends: template-scala-2.13-wconf
      jvm3:
        extends:
        - template-common-unchecked
        - template-scala-3
  template-scala-2.13:
    extends: template-common
    scala:
      options: -Xfatal-warnings -Xlint:-infer-any -Ywarn-extra-implicit -Ywarn-unused:_
        -opt-inline-from:<sources> -opt-inline-from:org.apache.pekko.** -opt:l:inline
      version: 2.13.18
  template-scala-2.13-main:
    extends:
    - template-common-main
    - template-scala-2.13-xlint
    scala:
      options: -Xlog-reflective-calls -Ywarn-dead-code
  template-scala-2.13-wconf:
    extends: template-scala-2.13-xlint
    scala:
      options: -Wconf:any:e,cat=unused-nowarn:s,cat=other-shadowing:s
  template-scala-2.13-xlint:
    extends:
    - template-common-unchecked
    - template-scala-2.13
    scala:
      options: -Xlint -deprecation
  template-scala-3:
    extends: template-common
    scala:
      options: -Wconf:cat=deprecation:s -Xtarget:17 -Yfuture-lazy-vals
      version: 3.3.8
