    dependencies:
    - io.dropwizard.metrics:metrics-jakarta-servlets:4.2.40
    - io.dropwizard.metrics:metrics-jetty12-ee10:4.2.40
    - io.dropwizard.metrics:metrics-jmx:4.2.40
    - io.dropwizard.metrics:metrics-jvm:4.2.40
