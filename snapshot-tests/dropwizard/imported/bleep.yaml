    - dropwizard-auth
    - dropwizard-logging
    extends:
    - template-common-test-junit-jupiter-api
    - template-common-test-mockito-core
    folder: ../maven-build/dropwizard-auth
  dropwizard-benchmarks:
    dependencies:
    - org.glassfish.jersey.test-framework:jersey-test-framework-core:3.1.12
    - org.openjdk.jmh:jmh-core:1.37
    - configuration: runtime
      module: org.openjdk.jmh:jmh-generator-annprocess:1.37
    dependsOn:
    - dropwizard-jersey
    - dropwizard-logging
    extends:
    - template-common-errorprone
    - template-common-main-boms
    folder: ../maven-build/dropwizard-benchmarks
  dropwizard-client:
    dependencies:
    - io.dropwizard.metrics:metrics-httpclient5:4.2.40
    - org.apache.httpcomponents.client5:httpclient5:5.6.4
    - org.apache.httpcomponents.core5:httpcore5:5.4.3
    - configuration: provided
      module: org.eclipse.jetty:jetty-util:12.1.11
    dependsOn: dropwizard-core
    extends:
    - template-common-errorprone
    - template-common-main-boms
    folder: ../maven-build/dropwizard-client
  dropwizard-client-test:
    dependencies:
    - net.bytebuddy:byte-buddy:1.18.14-jdk5
    - org.bouncycastle:bcprov-jdk18on:1.85.2
