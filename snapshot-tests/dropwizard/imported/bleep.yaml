    - template-common-main-boms
    folder: ../maven-build/dropwizard-configuration
  dropwizard-configuration-test:
    dependencies:
    - net.bytebuddy:byte-buddy:1.18.14-jdk5
    - org.junit.jupiter:junit-jupiter-params:5.14.4
    dependsOn:
    - dropwizard-configuration
    - dropwizard-jackson
    extends:
    - template-common-logback-classic
    - template-common-test-junit-jupiter-api
    folder: ../maven-build/dropwizard-configuration
