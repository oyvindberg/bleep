    - dropwizard-lifecycle
    - dropwizard-validation
    extends:
    - template-common-errorprone
    - template-common-main-boms
    folder: ../maven-build/dropwizard-db
  dropwizard-db-test:
    dependencies:
    - com.h2database:h2:2.4.240
    - net.bytebuddy:byte-buddy:1.18.14-jdk5
    - org.glassfish.hk2:hk2-locator:3.0.6
