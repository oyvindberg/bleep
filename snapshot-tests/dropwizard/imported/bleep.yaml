  dropwizard-e2e:
    dependsOn:
    - dropwizard-forms
    - dropwizard-views-mustache
    extends:
    - template-common-errorprone
    - template-common-main-boms
    folder: ../maven-build/dropwizard-e2e
  dropwizard-e2e-test:
    dependencies:
    - net.bytebuddy:byte-buddy:1.18.14-jdk5
    - org.awaitility:awaitility:4.3.0
    dependsOn:
    - dropwizard-auth
    - dropwizard-client
    - dropwizard-e2e
    - dropwizard-testing
    extends: template-common-test-junit-jupiter-api
    folder: ../maven-build/dropwizard-e2e
  dropwizard-example:
    boms: org.testcontainers:testcontainers-bom:2.0.5
    dependencies:
    - com.h2database:h2:2.4.240
    - exclusions:
        org.yaml: snakeyaml
      module: org.liquibase:liquibase-core:4.33.0
    dependsOn:
    - dropwizard-assets
    - dropwizard-auth
    - dropwizard-hibernate
    - dropwizard-http2
    - dropwizard-metrics-graphite
    - dropwizard-migrations
