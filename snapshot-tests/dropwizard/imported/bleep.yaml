  dropwizard-forms-test:
    dependencies: net.bytebuddy:byte-buddy:1.18.14-jdk5
    dependsOn: dropwizard-forms
    extends: template-common-test-junit-jupiter-api
    folder: ../maven-build/dropwizard-forms
