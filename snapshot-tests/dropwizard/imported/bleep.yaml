    - dropwizard-views-mustache
    extends: template-common-main-boms
    folder: ../maven-build/dropwizard-example
  dropwizard-example-test:
    dependencies:
    - com.mysql:mysql-connector-j:26.7.0
    - commons-codec:commons-codec:1.22.1
    - net.java.dev.jna:jna:5.19.1
    - org.glassfish.jersey.test-framework.providers:jersey-test-framework-provider-grizzly2:3.1.12
    - org.junit.jupiter:junit-jupiter-params:5.14.4
    - org.mockito:mockito-core:5.23.0
    - org.testcontainers:testcontainers-junit-jupiter:2.0.5
    - org.testcontainers:testcontainers-mysql:2.0.5
    dependsOn:
    - dropwizard-example
    - dropwizard-testing
    extends: template-common-test-junit-jupiter
    folder: ../maven-build/dropwizard-example
