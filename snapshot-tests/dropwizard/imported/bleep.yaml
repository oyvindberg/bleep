$schema: https://raw.githubusercontent.com/oyvindberg/bleep/master/schema.json
$version: dev
projects:
  docs:
    extends: template-common-main
    folder: ../maven-build/docs
  dropwizard-assets:
    dependsOn: dropwizard-core
    extends:
    - template-common-errorprone
    - template-common-main-boms
    folder: ../maven-build/dropwizard-assets
  dropwizard-assets-test:
    dependencies:
    - net.bytebuddy:byte-buddy:1.18.14-jdk5
    - org.mockito:mockito-core:5.23.0
    dependsOn: dropwizard-assets
    extends: template-common-test-junit-jupiter-api
    folder: ../maven-build/dropwizard-assets
  dropwizard-auth:
    dependencies: io.dropwizard.metrics:metrics-caffeine:4.2.40
    dependsOn: dropwizard-jersey
    extends: template-common-main-dependencies
    folder: ../maven-build/dropwizard-auth
  dropwizard-auth-test:
    dependencies:
    - com.google.guava:guava-testlib:33.6.0-jre
    - net.bytebuddy:byte-buddy:1.18.14-jdk5
    - org.glassfish.jersey.test-framework.providers:jersey-test-framework-provider-grizzly2:3.1.12
    - org.glassfish.jersey.test-framework:jersey-test-framework-core:3.1.12
