    - configuration: runtime
      module: jakarta.activation:jakarta.activation-api:2.1.4
    - jakarta.persistence:jakarta.persistence-api:3.1.0
    - configuration: runtime
      module: jakarta.xml.bind:jakarta.xml.bind-api:4.0.5
    - net.bytebuddy:byte-buddy:1.18.14-jdk5
