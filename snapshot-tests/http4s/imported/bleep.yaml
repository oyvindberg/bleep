$schema: https://raw.githubusercontent.com/oyvindberg/bleep/master/schema.json
$version: dev
jvm:
  name: temurin:17
projects:
  http4s-bench:
    dependencies:
    - io.circe::circe-parser:0.14.16
    - org.openjdk.jmh:jmh-core:1.37
    - org.openjdk.jmh:jmh-generator-bytecode:1.37
    - org.openjdk.jmh:jmh-generator-reflection:1.37
    - configuration: provided
      module: org.typelevel::scalac-compat-annotation:0.1.4
    dependsOn:
    - http4s-circe
    - http4s-ember-core
    extends:
    - template-common-main
    - template-cross-jvm-all
    - template-jvm
    folder: ../sbt-build/bench
    sources: ./src/${SCOPE}/scala-2.13+
  http4s-circe:
    dependencies:
    - io.circe::circe-core:0.14.16
    - io.circe::circe-jawn:0.14.16
    dependsOn: http4s-jawn
    extends:
    - template-common-cross-pure
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/circe
  http4s-circe-test:
    dependencies: io.circe::circe-testing:0.14.16
    dependsOn:
    - http4s-circe
    - http4s-jawn-test
    extends:
    - template-common-cross-pure
    - template-common-test
    - template-cross-all
    folder: ../sbt-build/circe
  http4s-client:
    dependencies: org.http4s::http4s-crypto:0.2.5
    dependsOn: http4s-core
    extends:
    - template-common-cross-full
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/client
  http4s-client-test:
    cross:
      jvm213:
        dependencies:
        - io.github.sbt-doctest::doctest-runtime:0.12.5
        - io.netty:netty-buffer:4.2.17.Final
        - io.netty:netty-codec-http:4.2.17.Final
      jvm3:
        dependencies:
        - io.github.sbt-doctest::doctest-runtime:0.12.5
        - io.netty:netty-buffer:4.2.17.Final
        - io.netty:netty-codec-http:4.2.17.Final
    dependsOn:
    - http4s-client
    - http4s-dsl
    - http4s-server
    - http4s-tests
    extends:
    - template-common-cross-full
    - template-common-test-logback-classic
    - template-cross-all
    folder: ../sbt-build/client
  http4s-client-testkit:
    cross:
      jvm213:
        dependencies:
        - io.netty:netty-buffer:4.2.17.Final
        - io.netty:netty-codec-http:4.2.17.Final
        - org.typelevel::log4cats-slf4j:2.8.0
      jvm3:
        dependencies:
        - io.netty:netty-buffer:4.2.17.Final
        - io.netty:netty-codec-http:4.2.17.Final
        - org.typelevel::log4cats-slf4j:2.8.0
    dependencies: org.typelevel::munit-cats-effect:2.2.0
    dependsOn:
    - http4s-client
    - http4s-dsl
    - http4s-server
    extends:
    - template-common-cross-full
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/client-testkit
  http4s-client-testkit-test:
    cross:
      jvm213:
        dependencies: io.github.sbt-doctest::doctest-runtime:0.12.5
      jvm3:
        dependencies: io.github.sbt-doctest::doctest-runtime:0.12.5
    dependsOn:
    - http4s-client-testkit
    - http4s-tests
    extends:
    - template-common-cross-full
    - template-common-test-logback-classic
    - template-cross-all
    folder: ../sbt-build/client-testkit
  http4s-core:
    cross:
      js213:
        dependencies:
        - io.github.cquiroz::locales-minimal-en_us-db:1.5.4
        - io.github.cquiroz::scala-java-time:2.7.0
        - forceJvm: true
          module: org.scala-js::scalajs-scalalib:${SCALA_VERSION}+${PLATFORM_VERSION}
        - configuration: provided
          module: org.scala-lang:scala-reflect:${SCALA_VERSION}
      js3:
        dependencies:
        - io.github.cquiroz::locales-minimal-en_us-db:1.5.4
        - io.github.cquiroz::scala-java-time:2.7.0
      jvm213:
        dependencies:
          configuration: provided
          module: org.scala-lang:scala-reflect:${SCALA_VERSION}
      native213:
        dependencies:
        - io.github.cquiroz::locales-minimal-en_us-db:1.5.4
        - io.github.cquiroz::scala-java-time:2.7.0
        - configuration: provided
          module: org.scala-lang:scala-reflect:${SCALA_VERSION}
      native3:
        dependencies:
        - io.github.cquiroz::locales-minimal-en_us-db:1.5.4
        - io.github.cquiroz::scala-java-time:2.7.0
        - forceJvm: true
          module: org.scala-lang::scala3-library:${SCALA_VERSION}
    dependencies:
    - co.fs2::fs2-core:3.14.0
    - co.fs2::fs2-io:3.14.0
    - com.comcast::ip4s-core:3.8.0
    - org.scodec::scodec-bits:1.2.5
    - org.typelevel::case-insensitive:1.5.0
    - org.typelevel::cats-core:2.13.0
    - org.typelevel::cats-effect-std:3.7.1
    - exclusions:
        org.typelevel: cats-core_2.13
      module: org.typelevel::cats-parse:1.1.0
    - org.typelevel::literally:1.2.0
    - org.typelevel::log4cats-core:2.8.0
    - org.typelevel::vault:3.7.0
    extends:
    - template-common-cross-full
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/core
    sourcegen:
      main: scripts.CopyImportedGeneratedFiles
      project: scripts
  http4s-core-test:
    cross:
      jvm213:
        dependencies:
          configuration: provided
          module: org.scala-lang:scala-reflect:${SCALA_VERSION}
        sources:
        - ./js-jvm/src/${SCOPE}/scala-2
        - ./jvm-native/src/${SCOPE}/scala-2
    dependencies:
    - io.github.sbt-doctest::doctest-runtime:0.12.5
    - org.scalameta::munit:1.3.6
    - org.typelevel::cats-laws:2.13.0
    - configuration: provided
      module: org.typelevel::scalac-compat-annotation:0.1.4
    dependsOn: http4s-core
    extends:
    - template-common-cross-full
    - template-common-test-logback-classic
    - template-cross-jvm-all
    - template-jvm
    folder: ../sbt-build/core
    resources:
    - ./js-jvm/src/${SCOPE}/resources
    - ./jvm-native/src/${SCOPE}/resources
    sourcegen:
      main: scripts.CopyImportedGeneratedFiles
      project: scripts
    sources:
    - ./js-jvm/src/${SCOPE}/scala
    - ./js-jvm/src/${SCOPE}/scala-${SCALA_BIN_VERSION}
    - ./jvm-native/src/${SCOPE}/scala
    - ./jvm-native/src/${SCOPE}/scala-${SCALA_BIN_VERSION}
  http4s-dsl:
    dependsOn: http4s-core
    extends:
    - template-common-cross-pure
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/dsl
  http4s-dsl-test:
    cross:
      jvm213:
        dependencies: io.github.sbt-doctest::doctest-runtime:0.12.5
      jvm3:
        dependencies: io.github.sbt-doctest::doctest-runtime:0.12.5
    dependsOn:
    - http4s-dsl
    - http4s-tests
    extends:
    - template-common-cross-pure
    - template-common-test-logback-classic
    - template-cross-all
    folder: ../sbt-build/dsl
    sourcegen:
      main: scripts.CopyImportedGeneratedFiles
      project: scripts
  http4s-ember-client:
    dependencies: org.typelevel::keypool:0.4.11
    dependsOn:
    - http4s-client
    - http4s-ember-core
    extends:
    - template-common-cross-full
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/ember-client
  http4s-ember-client-test:
    dependsOn:
    - http4s-client-testkit
    - http4s-ember-client
    - http4s-ember-core-test
    extends:
    - template-common-cross-full
    - template-common-test
    - template-cross-all
    folder: ../sbt-build/ember-client
  http4s-ember-core:
    cross:
      js213:
        dependencies: org.http4s::hpack:1.1.0
      js3:
        dependencies: org.http4s::hpack:1.1.0
      jvm213:
        dependencies: com.twitter:hpack:1.0.2
      jvm3:
        dependencies: com.twitter:hpack:1.0.2
      native213:
        dependencies: org.http4s::hpack:1.1.0
      native3:
        dependencies: org.http4s::hpack:1.1.0
    dependsOn: http4s-core
    extends:
    - template-common-cross-full
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/ember-core
  http4s-ember-core-test:
    cross:
      jvm213:
        dependencies: io.github.sbt-doctest::doctest-runtime:0.12.5
      jvm3:
        dependencies: io.github.sbt-doctest::doctest-runtime:0.12.5
    dependencies:
    - org.typelevel::log4cats-noop:2.8.0
    - org.typelevel::log4cats-testing:2.8.0
    dependsOn:
    - http4s-ember-core
    - http4s-tests
    extends:
    - template-common-cross-full
    - template-common-test-logback-classic
    - template-cross-all
    folder: ../sbt-build/ember-core
  http4s-ember-server:
    dependsOn:
    - http4s-ember-core
    - http4s-server
    extends:
    - template-common-cross-full
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/ember-server
  http4s-ember-server-test:
    cross:
      jvm213:
        dependencies:
        - com.github.jnr:jnr-unixsocket:0.39.3
        - org.java-websocket:Java-WebSocket:1.6.0
      jvm3:
        dependencies:
        - com.github.jnr:jnr-unixsocket:0.39.3
        - org.java-websocket:Java-WebSocket:1.6.0
    dependsOn:
    - http4s-ember-client
    - http4s-ember-core-test
    - http4s-ember-server
    - http4s-server-test
    extends:
    - template-common-cross-full
    - template-common-test
    - template-cross-all
    folder: ../sbt-build/ember-server
  http4s-examples:
    dependencies:
    - configuration: runtime
      module: ch.qos.logback:logback-classic:1.2.6
    - configuration: runtime
      module: io.circe::circe-generic:0.14.16
    - configuration: provided
      module: org.typelevel::scalac-compat-annotation:0.1.4
    dependsOn:
    - http4s-circe
    - http4s-dsl
    - http4s-server
    extends:
    - template-common-main
    - template-cross-jvm-all
    - template-jvm
    folder: ../sbt-build/examples
    sources: ./src/${SCOPE}/scala-2.13+
  http4s-examples-docker:
    dependencies:
    - org.typelevel::log4cats-slf4j:2.8.0
    - configuration: provided
      module: org.typelevel::scalac-compat-annotation:0.1.4
    dependsOn:
    - http4s-dsl
    - http4s-ember-server
    extends:
    - template-common-main
    - template-cross-jvm-all
    - template-jvm
    folder: ../sbt-build/examples/docker
    sources: ./src/${SCOPE}/scala-2.13+
  http4s-examples-ember:
    dependencies:
    - org.typelevel::log4cats-slf4j:2.8.0
    - configuration: provided
      module: org.typelevel::scalac-compat-annotation:0.1.4
    dependsOn:
    - http4s-ember-client
    - http4s-ember-server
    - http4s-examples
    extends:
    - template-common-main
    - template-cross-jvm-all
    - template-jvm
    folder: ../sbt-build/examples/ember
    platform:
      jvmOptions: -Duser.dir=${PROJECT_DIR}
    sources: ./src/${SCOPE}/scala-2.13+
  http4s-jawn:
    dependencies:
    - org.typelevel::jawn-fs2:2.6.0
    - org.typelevel::jawn-parser:1.7.0
    dependsOn: http4s-core
    extends:
    - template-common-cross-pure
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/jawn
  http4s-jawn-test:
    cross:
      jvm213:
        dependencies: io.github.sbt-doctest::doctest-runtime:0.12.5
      jvm3:
        dependencies: io.github.sbt-doctest::doctest-runtime:0.12.5
    dependsOn:
    - http4s-jawn
    - http4s-tests
    extends:
    - template-common-cross-pure
    - template-common-test-logback-classic
    - template-cross-all
    folder: ../sbt-build/jawn
  http4s-laws:
    dependencies:
    - com.comcast::ip4s-test-kit:3.8.0
    - org.typelevel::case-insensitive-testing:1.5.0
    - org.typelevel::cats-effect-testkit:3.7.1
    - org.typelevel::cats-effect:3.7.1
    - org.typelevel::cats-laws:2.13.0
    - org.typelevel::discipline-core:1.7.0
    - org.typelevel::munit-cats-effect:2.2.0
    - org.typelevel::scalacheck-effect-munit:2.1.0
    dependsOn: http4s-core
    extends:
    - template-common-cross-pure
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/laws
  http4s-scalafix-internal:
    cross:
      jvm213:
        dependencies: ch.epfl.scala::scalafix-core:0.14.7
    dependencies:
      configuration: provided
      module: org.typelevel::scalac-compat-annotation:0.1.4
    extends:
    - template-common-main
    - template-cross-jvm-all
    - template-jvm
    folder: ../sbt-build/scalafix-internal/rules
    sources: ./src/${SCOPE}/scala-2.13+
  http4s-server:
    dependencies: org.http4s::http4s-crypto:0.2.5
    dependsOn: http4s-core
    extends:
    - template-common-cross-full
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/server
  http4s-server-test:
    cross:
      jvm213:
        dependencies: io.github.sbt-doctest::doctest-runtime:0.12.5
      jvm3:
        dependencies: io.github.sbt-doctest::doctest-runtime:0.12.5
    dependsOn:
    - http4s-dsl
    - http4s-server
    - http4s-tests
    extends:
    - template-common-cross-full
    - template-common-test-logback-classic
    - template-cross-all
    folder: ../sbt-build/server
    sourcegen:
      main: scripts.CopyImportedGeneratedFiles
      project: scripts
  http4s-tests:
    dependencies:
    - org.typelevel::discipline-munit:2.0.0
    - org.typelevel::scalacheck-effect:2.1.0
    dependsOn: http4s-laws
    extends:
    - template-common-cross-full
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/tests
  http4s-tests-test:
    cross:
      jvm213:
        dependencies: io.github.sbt-doctest::doctest-runtime:0.12.5
      jvm3:
        dependencies: io.github.sbt-doctest::doctest-runtime:0.12.5
    dependsOn: http4s-tests
    extends:
    - template-common-cross-full
    - template-common-test-logback-classic
    - template-cross-all
    folder: ../sbt-build/tests
  scalafixinternalinput:
    dependencies:
      configuration: provided
      module: org.typelevel::scalac-compat-annotation:0.1.4
    dependsOn: http4s-core
    extends:
    - template-common-main
    - template-cross-jvm-all
    - template-jvm
    folder: ../sbt-build/scalafix-internal/input
    sources: ./src/${SCOPE}/scala-2.13+
  scalafixinternaloutput:
    dependencies:
      configuration: provided
      module: org.typelevel::scalac-compat-annotation:0.1.4
    dependsOn: http4s-core
    extends:
    - template-common-main
    - template-cross-jvm-all
    - template-jvm
    folder: ../sbt-build/scalafix-internal/output
    sources: ./src/${SCOPE}/scala-2.13+
  scalafixinternaltests:
    cross:
      jvm3:
        scala:
          options: -Yrangepos
    dependencies:
      configuration: provided
      module: org.typelevel::scalac-compat-annotation:0.1.4
    dependsOn: http4s-scalafix-internal
    extends:
    - template-common-main
    - template-cross-jvm-all
    - template-jvm
    folder: ../sbt-build/scalafix-internal/tests
    sources: ./src/${SCOPE}/scala-2.13+
  scalafixinternaltests-test:
    cross:
      jvm213:
        dependencies: ch.epfl.scala:::scalafix-testkit:0.14.7
      jvm3:
        scala:
          options: -Yrangepos
    dependencies:
    - io.github.sbt-doctest::doctest-runtime:0.12.5
    - configuration: provided
      module: org.typelevel::scalac-compat-annotation:0.1.4
    dependsOn: scalafixinternaltests
    extends:
    - template-common-test
    - template-cross-jvm-all
    - template-jvm
    folder: ../sbt-build/scalafix-internal/tests
    sourcegen:
      main: scripts.CopyImportedGeneratedFiles
      project: scripts
    sources: ./src/${SCOPE}/scala-2.13+
  scripts:
    dependencies: build.bleep:bleepscript:1.0.0-M14
    platform:
      name: jvm
    resources: ./resources
templates:
  template-common:
    ignoreEvictionErrors: no
    java:
      options: --release 8 -Xlint:all -encoding utf8
    scala:
      options: -Wvalue-discard -deprecation -encoding UTF-8 -feature -unchecked
      setup:
        addLibraryToBootClasspath: false
        filterLibraryFromClasspath: false
        manageBootClasspath: false
        order: mixed
  template-common-cross-full:
    extends: template-common
    source-layout: cross-full
    sources: ./shared/src/${SCOPE}/scala-2.13+
  template-common-cross-pure:
    extends: template-common
    source-layout: cross-pure
    sources: ./src/${SCOPE}/scala-2.13+
  template-common-main:
    extends: template-common
    publish:
      groupId: org.http4s
    sbt-scope: main
  template-common-test:
    extends: template-common
    isTestProject: true
    sbt-scope: test
    testFrameworks:
    - hedgehog.sbt.Framework
    - weaver.framework.CatsEffect
    - zio.test.sbt.ZTestFramework
  template-common-test-logback-classic:
    dependencies:
    - ch.qos.logback:logback-classic:1.2.6
    - org.scalacheck::scalacheck:1.20.0
    extends: template-common-test
  template-cross-all:
    cross:
      js213:
        extends: template-scala-2.13-js
      js3:
        extends: template-scala-3-js
      jvm213:
        dependencies:
          configuration: provided
          forceJvm: true
          module: org.typelevel::scalac-compat-annotation:0.1.4
        extends:
        - template-jvm
        - template-scala-2.13
      jvm3:
        dependencies:
          configuration: provided
          forceJvm: true
          module: org.typelevel::scalac-compat-annotation:0.1.4
        extends:
        - template-jvm
        - template-scala-3
      native213:
        extends:
        - template-native
        - template-scala-2.13
      native3:
        extends:
        - template-native
        - template-scala-3
  template-cross-jvm-all:
    cross:
      jvm213:
        extends: template-scala-2.13
      jvm3:
        extends: template-scala-3
  template-js:
    extends: template-js-and-native
    platform:
      jsEmitSourceMaps: false
      jsJsdom: false
      jsKind: none
      jsNodeVersion: 24.18.0
      jsVersion: 1.22.0
      name: js
  template-js-and-native:
    dependencies:
      configuration: provided
      forceJvm: true
      module: org.typelevel::scalac-compat-annotation:0.1.4
    extends: template-common
    libraryVersionSchemes:
      forceJvm: true
      module: org.scala-native::test-interface_native0.5:always
  template-jvm:
    extends: template-common
    libraryVersionSchemes: org.scala-native::test-interface_native0.5:always
    platform:
      name: jvm
  template-native:
    extends: template-js-and-native
    platform:
      name: native
      nativeEmbedResources: false
      nativeGc: ''
      nativeOptimize: true
      nativeUseIncrementalCompilation: true
      nativeVersion: 0.5.12
  template-scala-2.13:
    extends: template-common
    scala:
      compilerPlugins:
      - com.olegpy::better-monadic-for:0.3.1
      - org.typelevel:::kind-projector:0.13.4
      options: -Wconf:cat=lint-infer-any&msg=kind-polymorphic:s -Wconf:cat=scala3-migration:s
        -Wdead-code -Wextra-implicit -Wnumeric-widen -Wunused -Xlint:_,-implicit-recursion,-recurse-with-default,-unused,-byname-implicit
        -Xsource:3 -Ybackend-parallelism 16 -Yrangepos -language:_ -release 8
      version: 2.13.18
  template-scala-2.13-js:
    extends:
    - template-js
    - template-scala-2.13
    scala:
      options: -P:scalajs:mapSourceURI:file:${BUILD_DIR}/->https://raw.githubusercontent.com/http4s/http4s/f4419aab12e149093ceeca82eb00bd12dfbb3b07/
  template-scala-3:
    extends: template-common
    scala:
      options: -Wunused:explicits -Wunused:implicits -Wunused:imports -Wunused:locals
        -Wunused:params -Wunused:privates -Ykind-projector -java-output-version 8
        -language:implicitConversions
      version: 3.3.6
  template-scala-3-js:
    extends:
    - template-js
    - template-scala-3
    scala:
      options: -scalajs-mapSourceURI:file:${BUILD_DIR}/->https://raw.githubusercontent.com/http4s/http4s/f4419aab12e149093ceeca82eb00bd12dfbb3b07/
