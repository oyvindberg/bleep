templates:
  template-common:
    ignoreEvictionErrors: no
    scala:
      setup:
        order: mixed
  template-common-deprecation:
    extends: template-common
    scala:
      options: -deprecation -encoding UTF-8 -feature -release 11 -unchecked
  template-common-main:
    extends: template-common
    publish:
      groupId: dev.zio
    sbt-scope: main
  template-common-test:
    extends: template-common
    isTestProject: true
    sbt-scope: test
    testFrameworks:
    - hedgehog.sbt.Framework
    - weaver.framework.CatsEffect
    - zio.test.sbt.ZTestFramework
  template-common-test-jcstress-core:
    dependencies:
    - net.sf.jopt-simple:jopt-simple:4.6
    - org.openjdk.jcstress:jcstress-core:0.3
    extends: template-common-test
  template-cross-all:
    cross:
      jvm213:
        extends:
        - template-jvm
        - template-scala-2-xfatal-warnings
        - template-scala-2.13
        scala:
          options: -Ybackend-parallelism:4
  template-cross-js-212-213-jvm-212-213-native-212-213:
    cross:
      jvm213:
        extends: template-scala-2-scala-compiler
  template-cross-js-all-jvm-all:
    cross:
      jvm213:
        extends:
        - template-jvm
        - template-scala-2-xfatal-warnings
        - template-scala-2.13
        platform:
          jvmOptions: -Duser.dir=${PROJECT_DIR}/.jvm
        scala:
          options: -Ybackend-parallelism:4
  template-cross-jvm-all:
    cross:
      jvm213:
        extends:
        - template-scala-2-xfatal-warnings
        - template-scala-2.13
        scala:
          options: -Ybackend-parallelism:4
  template-js:
    extends: template-common
    platform:
      jsEmitSourceMaps: false
      jsJsdom: false
      jsKind: none
      jsNodeVersion: 24.18.0
      jsVersion: 1.22.0
      name: js
  template-jvm:
    extends: template-common
    platform:
      name: jvm
  template-jvm-test-dependencies:
    dependencies:
    - com.google.inject:guice:6.0.0
    - junit:junit:4.13.2
    - org.apache.maven.resolver:maven-resolver-connector-basic:1.9.27
    - org.apache.maven.resolver:maven-resolver-transport-http:1.9.27
    - org.apache.maven:maven-compat:3.9.16
    - org.apache.maven:maven-embedder:3.9.16
    - org.codehaus.plexus:plexus-component-annotations:2.2.0
    - org.eclipse.sisu:org.eclipse.sisu.inject:1.1.0
    - org.scala-lang.modules::scala-xml:2.5.0
    - org.slf4j:slf4j-simple:2.0.20
    extends:
    - template-common-deprecation
    - template-common-test-jcstress-core
    - template-jvm
  template-jvm-test-project.dir:
    extends:
    - template-common-deprecation
    - template-common-test-jcstress-core
    - template-jvm
    platform:
      jvmOptions: -Dproject.dir=${PROJECT_DIR} -Dproject.version=2.1.26+231-18e9a918-SNAPSHOT
        -Duser.dir=${PROJECT_DIR}
  template-native:
    extends: template-common-deprecation
    platform:
      name: native
      nativeEmbedResources: false
      nativeGc: ''
      nativeOptimize: true
      nativeUseIncrementalCompilation: true
      nativeVersion: 0.5.12
    scala:
      options: -P:scalanative:genStaticForwardersForNonTopLevelObjects
  template-scala-2:
    extends: template-common
    scala:
      options: -Yrangepos
  template-scala-2-scala-compiler:
    dependencies:
    - configuration: provided
      module: org.scala-lang:scala-compiler:${SCALA_VERSION}
    - configuration: provided
      module: org.scala-lang:scala-reflect:${SCALA_VERSION}
    extends: template-scala-2-xlint
  template-scala-2-xfatal-warnings:
    extends: template-scala-2-xlint
    scala:
      options: -Xfatal-warnings
  template-scala-2-xlint:
    extends:
    - template-common-deprecation
    - template-scala-2
    scala:
      options: -Xlint:_,-missing-interpolator,-type-parameter-shadow,-infer-any -Ywarn-numeric-widen
        -Ywarn-unused:params,-implicits -Ywarn-value-discard -explaintypes -language:existentials
        -language:higherKinds
  template-scala-2.12:
    extends: template-scala-2-xlint
    scala:
      options: -Xfuture -Xmax-classfile-name 242 -Xsource:2.13 -Yno-adapted-args -Ypartial-unification
        -Ywarn-extra-implicit -Ywarn-inaccessible -Ywarn-nullary-override -Ywarn-nullary-unit
        -Ywarn-unused:_,imports -Ywarn-unused:imports -opt-warnings
      version: 2.12.21
  template-scala-2.12-jvm-test-scala.compat.version:
    extends:
    - template-jvm-test-dependencies
    - template-jvm-test-project.dir
    - template-scala-2-xfatal-warnings
    - template-scala-2.12
    platform:
      jvmOptions: -Dscala.compat.version=2.12 -Dscala.version=2.12.21
  template-scala-2.13:
    extends: template-scala-2.13-and-3
    scala:
      version: 2.13.18
  template-scala-2.13-and-3:
    extends: template-common
    scala:
      setup:
        addLibraryToBootClasspath: false
        filterLibraryFromClasspath: false
        manageBootClasspath: false
  template-scala-2.13-js:
    extends:
    - template-js
    - template-scala-2-xfatal-warnings
    - template-scala-2.13
    scala:
      options: -Ybackend-parallelism:4
  template-scala-2.13-jvm-test-scala.compat.version:
    extends:
    - template-jvm-test-dependencies
    - template-jvm-test-project.dir
    - template-scala-2-xfatal-warnings
    - template-scala-2.13
    platform:
      jvmOptions: -Dscala.compat.version=2.13 -Dscala.version=2.13.18
  template-scala-2.13-native:
    extends:
    - template-native
    - template-scala-2-xlint
    - template-scala-2.13
    scala:
      options: -Ybackend-parallelism:4
  template-scala-3:
    extends: template-scala-2.13-and-3
    scala:
      version: 3.3.8
  template-scala-3-xignore-scala2-macros:
    extends:
    - template-common-deprecation
    - template-scala-3
    scala:
      options: -Xignore-scala2-macros -Xmax-inlines:64 -language:implicitConversions
        -language:noAutoTupling -noindent
