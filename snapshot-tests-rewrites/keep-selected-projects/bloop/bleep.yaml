$schema: https://raw.githubusercontent.com/oyvindberg/bleep/master/schema.json
$version: dev
jvm:
  name: temurin:17
projects:
  bloop-cli:
    dependencies:
    - com.github.alexarchambault::case-app:2.1.0-M30
    - com.github.plokhotnyuk.jsoniter-scala::jsoniter-scala-core:2.13.3.2
    - configuration: provided
      module: com.github.plokhotnyuk.jsoniter-scala::jsoniter-scala-macros:2.13.3.2
    - com.lihaoyi::os-lib:0.11.4
    - io.get-coursier.util:directories-jni:0.1.3
    - io.get-coursier::coursier-jvm:2.1.24
    - io.get-coursier::coursier:2.1.24
    - io.get-coursier::dependency:0.3.2
    - configuration: provided
      module: org.graalvm.nativeimage:svm:24.2.1
    dependsOn: bloop-rifle
    extends:
    - template-scala-2-main-resources
    - template-scala-2.13
    folder: ../sbt-build/cli
    platform:
      jvmOptions: -Duser.dir=${PROJECT_DIR}
    sourcegen:
      main: scripts.CopyImportedGeneratedFiles
      project: scripts
  bloop-rifle:
    dependencies:
    - ch.epfl.scala::libdaemon:0.0.12
    - ch.epfl.scala:bsp4j:2.1.1
    - io.github.alexarchambault.scala-cli.snailgun::snailgun-core:0.4.1-sc2
    - org.scala-lang.modules::scala-collection-compat:2.13.0
    extends:
    - template-scala-2-main-resources
    - template-scala-2.13
    folder: ../sbt-build/bloop-rifle
    sourcegen:
      main: scripts.CopyImportedGeneratedFiles
      project: scripts
  bloop-rifle-test:
    dependencies:
    - com.eed3si9n.expecty::expecty:0.17.0
    - org.scalameta::munit:1.1.1
    dependsOn: bloop-rifle
    extends:
    - template-common-test
    - template-scala-2.13
    folder: ../sbt-build/bloop-rifle
    sbt-scope: test
  scripts:
    dependencies: build.bleep:bleepscript:1.0.0-M14
    platform:
      name: jvm
    resources: ./resources
templates:
  template-bloop-frontend:
    dependencies:
      configuration: provided
      module: com.github.plokhotnyuk.jsoniter-scala::jsoniter-scala-macros:2.13.3.2
    extends: template-scala-2.12.20-xlint
    platform:
      jvmOptions: -Duser.dir=${PROJECT_DIR} -XX:MaxInlineLevel=20 -XX:ReservedCodeCacheSize=512m
        -Xms1g -Xmx3g
  template-common:
    ignoreEvictionErrors: no
    platform:
      name: jvm
  template-common-main:
    extends: template-common
    sbt-scope: main
  template-common-main-git.localdir:
    extends: template-common-main
    platform:
      jvmOptions: -Dgit.localdir=. -Dsbt.launcher=${COURSIER_ARC_CACHE_DIR}/https/github.com/sbt/sbt/releases/download/v1.10.11/sbt-1.10.11.zip/sbt/bin/sbt-launch.jar
        -DscalaRef=v2.12.19 -DscalaVersion=2.12.19
  template-common-test:
    extends: template-scala-2.12.20-and-2.13
    isTestProject: true
    testFrameworks:
    - hedgehog.sbt.Framework
    - weaver.framework.CatsEffect
    - zio.test.sbt.ZTestFramework
  template-scala-2:
    extends: template-common
    scala:
      setup:
        order: mixed
  template-scala-2-main:
    extends:
    - template-common-main
    - template-scala-2
    publish:
      groupId: ch.epfl.scala
  template-scala-2-main-resources:
    extends:
    - template-scala-2-main
    - template-scala-2.12.20-and-2.13
    resources:
    - ../LICENSE.md
    - ../NOTICE.md
  template-scala-2.12.20:
    extends: template-scala-2.12.20-and-2.13
    scala:
      options: -Yno-adapted-args -deprecation
      version: 2.12.20
  template-scala-2.12.20-and-2.13:
    extends: template-scala-2
    scala:
      options: -Xfuture -Ywarn-numeric-widen -Ywarn-value-discard -encoding UTF-8
        -feature -language:existentials -language:higherKinds -language:implicitConversions
        -unchecked
  template-scala-2.12.20-main-resources:
    extends:
    - template-scala-2-main
    - template-scala-2.12.20
    resources:
    - ../../LICENSE.md
    - ../../NOTICE.md
  template-scala-2.12.20-xlint:
    extends: template-scala-2.12.20
    scala:
      options: -Xlint:unused -Yrangepos -Ywarn-unused
  template-scala-2.13:
    extends: template-scala-2.12.20-and-2.13
    scala:
      setup:
        addLibraryToBootClasspath: false
        filterLibraryFromClasspath: false
        manageBootClasspath: false
      version: 2.13.16
