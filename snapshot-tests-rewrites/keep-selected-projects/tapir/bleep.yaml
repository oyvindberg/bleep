templates:
  template-common:
    ignoreEvictionErrors: yes
    resources: ./src/${SCOPE}/protobuf
    scala:
      options: '"-Wconf:msg=unused value of type org.scalatest.Assertion:s" "-Wconf:msg=unused
        value of type org.scalatest.compatible.Assertion:s"'
      setup:
        order: mixed
    sources: ./src/${SCOPE}/protobuf
  template-common-main:
    extends: template-common
    publish:
      groupId: com.softwaremill.sttp.tapir
    sbt-scope: main
  template-common-test:
    extends: template-scala-2-and-3.3.8
    isTestProject: true
    sbt-scope: test
    testFrameworks:
    - hedgehog.sbt.Framework
    - weaver.framework.CatsEffect
    - zio.test.sbt.ZTestFramework
  template-common-test-dependencies:
    dependencies:
    - org.scalacheck::scalacheck:1.19.0
    - org.scalatest::scalatest:3.2.18
    - org.scalatestplus::scalacheck-1-19:3.2.20.0
    extends: template-common-test
  template-cross-js-212-213: {}
  template-cross-js-all-jvm-all:
    extends:
    - template-cross-js-212-213
    - template-cross-jvm-all
  template-cross-jvm-212-213:
    cross:
      jvm213:
        extends: template-scala-2.13-jvm
  template-cross-jvm-212-native-3:
    extends: template-cross-native-3
  template-cross-jvm-213-3:
    cross:
      jvm213:
        extends: template-scala-2.13-jvm
  template-cross-jvm-all:
    extends: template-cross-jvm-212-213
  template-cross-jvm-all-jvm-akka:
    cross:
      jvm213:
        extends:
        - template-jvm-akka
        - template-jvm-pekko
  template-cross-native-3: {}
  template-cross-native-all:
    extends: template-cross-native-3
  template-js:
    extends: template-scala-2-and-3.3.8
    platform:
      jsEmitSourceMaps: false
      jsJsdom: false
      jsKind: none
      jsNodeVersion: 24.18.0
      jsVersion: 1.22.0
      name: js
  template-js-and-jvm-fs2:
    dependencies:
    - configuration: optional
      module: com.softwaremill.sttp.shared::fs2:1.5.2
    - configuration: optional
      module: com.softwaremill.sttp.shared::zio:1.5.2
    extends: template-scala-2-and-3.3.8
  template-jvm:
    extends: template-common
    platform:
      name: jvm
  template-jvm-akka:
    dependencies:
    - configuration: optional
      module: com.softwaremill.sttp.shared::akka:1.5.2
    - configuration: optional
      module: com.typesafe.akka::akka-stream:2.6.20
    extends:
    - template-jvm
    - template-scala-2-and-3.3.8
  template-jvm-main-dependencies:
    dependencies:
    - ch.qos.logback:logback-classic:1.6.3
    - org.http4s::http4s-dsl:0.23.37
    - org.http4s::http4s-ember-server:0.23.37
    extends:
    - template-common-main
    - template-jvm
    - template-scala-2-and-3.3.8
  template-jvm-pekko:
    dependencies:
    - configuration: optional
      module: com.softwaremill.sttp.shared::pekko:1.5.2
    - configuration: optional
      module: org.apache.pekko::pekko-stream:1.7.0
    extends:
    - template-jvm
    - template-scala-2-and-3.3.8
  template-native:
    extends: template-scala-2-and-3.3.8
    platform:
      name: native
      nativeEmbedResources: false
      nativeGc: ''
      nativeOptimize: true
      nativeUseIncrementalCompilation: true
      nativeVersion: 0.5.12
  template-scala-2:
    extends: template-common
    scala:
      compilerPlugins: org.typelevel:::kind-projector:0.13.4
      options: -Ywarn-macros:after
      strict: true
  template-scala-2-and-3.3.8:
    extends: template-common
    source-layout: sbt-matrix
  template-scala-2-jvm:
    extends:
    - template-jvm
    - template-scala-2
    scala:
      options: -target:jvm-1.8
  template-scala-2.12:
    extends: template-scala-2
    scala:
      version: 2.12.21
    sources: ./src/${SCOPE}/scala-2.13-
  template-scala-2.13:
    extends:
    - template-scala-2
    - template-scala-2-and-3.3.8
    - template-scala-2.13-and-3
    scala:
      options: -Wconf:cat=other-match-analysis:error
      version: 2.13.18
    sources: ./src/${SCOPE}/scala-2.13+
  template-scala-2.13-and-3:
    extends: template-common
    scala:
      options: -language:higherKinds
      setup:
        addLibraryToBootClasspath: false
        filterLibraryFromClasspath: false
        manageBootClasspath: false
    sources: ./src/${SCOPE}/scala-3-2.13+
  template-scala-2.13-jvm:
    extends:
    - template-scala-2-jvm
    - template-scala-2.13
    sources: ./src/${SCOPE}/scalajvm-3-2.13+
  template-scala-3:
    extends: template-scala-2.13-and-3
    scala:
      options: -Wnonunit-statement -Wunused:explicits -Wunused:implicits -Wunused:imports
        -Wunused:locals -Wunused:params -Wunused:privates -Wvalue-discard -Xmax-inlines
        64 -deprecation -encoding utf8 -feature -language:experimental.macros -language:implicitConversions
        -unchecked
  template-scala-3-jvm:
    extends:
    - template-jvm
    - template-scala-3
    sources: ./src/${SCOPE}/scalajvm-3-2.13+
  template-scala-3.3.8:
    extends:
    - template-scala-2-and-3.3.8
    - template-scala-3
    scala:
      options: -Ykind-projector
      version: 3.3.8
  template-scala-3.3.8-jvm:
    extends:
    - template-scala-3-jvm
    - template-scala-3.3.8
    scala:
      options: -Yfuture-lazy-vals
  template-scala-3.3.8-jvm-java-output-version:
    extends: template-scala-3.3.8-jvm
    scala:
      options: -java-output-version 11
