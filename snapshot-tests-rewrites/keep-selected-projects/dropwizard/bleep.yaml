$schema: https://raw.githubusercontent.com/oyvindberg/bleep/master/schema.json
$version: dev
jvm:
  name: temurin:17
projects: {}
resolvers:
  name: ossrh
  type: maven
  uri: https://central.sonatype.com/repository/maven-snapshots/
templates:
  template-common:
    platform:
      jvmOptions: -Duser.dir=${PROJECT_DIR}
      name: jvm
  template-common-main:
    extends: template-common
    publish:
      groupId: io.dropwizard
    sbt-scope: main
  template-common-main-boms:
    boms:
    - com.fasterxml.jackson:jackson-bom:2.22.2
    - io.dropwizard.metrics:metrics-bom:4.2.40
    - org.eclipse.jetty.ee10:jetty-ee10-bom:12.1.11
    - org.eclipse.jetty:jetty-bom:12.1.11
    - org.glassfish.jersey:jersey-bom:3.1.12
    - org.jdbi:jdbi3-bom:3.54.0
    - org.junit:junit-bom:5.14.4
    - org.mockito:mockito-bom:5.23.0
    - org.slf4j:slf4j-bom:2.0.19
    extends: template-common-main
  template-common-test:
    extends: template-common
    isTestProject: true
    sbt-scope: test
  template-common-test-assertj-core:
    dependencies: org.assertj:assertj-core:3.27.7
    extends: template-common-test
  template-common-test-junit-jupiter:
    dependencies: org.junit.jupiter:junit-jupiter:5.14.4
    extends: template-common-test-assertj-core
  template-dropwizard-testing:
    dependencies:
    - configuration: provided
      module: jakarta.persistence:jakarta.persistence-api:3.1.0
    - configuration: provided
      module: net.bytebuddy:byte-buddy:1.18.14-jdk5
    - configuration: provided
      module: org.glassfish.jersey.core:jersey-common:3.1.12
    - configuration: provided
      module: org.hibernate.orm:hibernate-core:6.6.58.Final
    - configuration: optional
      module: org.junit.jupiter:junit-jupiter-api:5.14.4
    - configuration: optional
      module: org.junit.jupiter:junit-jupiter:5.14.4
    - configuration: optional
      module: org.junit.platform:junit-platform-commons:1.14.4
    extends: template-java-17
  template-java-17:
    extends: template-common
    java:
      annotationProcessors:
      - com.google.errorprone:error_prone_core:2.42.0
      - com.uber.nullaway:nullaway:0.13.8
      - jp.skypencil.errorprone.slf4j:errorprone-slf4j:0.1.29
      options: --release 17 --should-stop=ifError=FLOW -XDcompilePolicy=simple "-Xplugin:ErrorProne
        -XepDisableWarningsInGeneratedCode -Xep:EqualsGetClass:OFF -Xep:NullAway:ERROR
        -XepOpt:NullAway:AnnotatedPackages=io.dropwizard -XepOpt:NullAway:ExcludedFieldAnnotations=org.mockito.Mock
        -XepOpt:NullAway:UnannotatedSubPackages=io.dropwizard.benchmarks"
  template-java-17-logback-classic:
    dependencies:
    - ch.qos.logback:logback-classic:1.5.38
    - ch.qos.logback:logback-core:1.5.38
    extends: template-java-17
  template-java-17-main-dependencies:
    dependencies:
    - org.eclipse.jetty.ee10:jetty-ee10-servlet:12.1.11
    - org.eclipse.jetty:jetty-security:12.1.11
    - org.eclipse.jetty:jetty-server:12.1.11
    extends:
    - template-common-main-boms
    - template-java-17
  template-java-17-source:
    extends: template-common
    java:
      options: -source 17 -target 17
      scanForAnnotationProcessors: if-present
  template-java-17-test:
    dependencies: org.junit.jupiter:junit-jupiter-api:5.14.4
    extends:
    - template-common-test-junit-jupiter
    - template-java-17
  template-java-17-test-mockito-core:
    dependencies:
    - org.mockito:mockito-core:5.23.0
    - org.mockito:mockito-junit-jupiter:5.23.0
    extends: template-common-test
