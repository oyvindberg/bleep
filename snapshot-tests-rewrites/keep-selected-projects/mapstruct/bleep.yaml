$schema: https://raw.githubusercontent.com/oyvindberg/bleep/master/schema.json
$version: dev
projects: {}
resolvers:
  name: gradle
  type: maven
  uri: https://repo.gradle.org/artifactory/libs-releases/
templates:
  template-common:
    platform:
      jvmOptions: -Duser.dir=${PROJECT_DIR}
      name: jvm
  template-common-main:
    boms:
    - org.jboss.arquillian:arquillian-bom:1.7.2.Final
    - org.jetbrains.kotlin:kotlin-bom:2.3.0
    - org.junit:junit-bom:5.14.1
    extends: template-common
    publish:
      groupId: org.mapstruct
    sbt-scope: main
  template-common-test:
    dependencies: org.assertj:assertj-core:3.27.7
    extends: template-common
    isTestProject: true
    platform:
      jvmOptions: -Xms1024m -Xmx3072m
    sbt-scope: test
