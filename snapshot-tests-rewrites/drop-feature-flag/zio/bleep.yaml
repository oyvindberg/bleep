    cross:
      jvm212:
        extends:
        - template-scala-2-xfatal-warnings
        - template-scala-2.12
      jvm213:
        extends:
        - template-scala-2-xfatal-warnings
        - template-scala-2.13
        scala:
          options: -Ybackend-parallelism:4
      jvm3:
        extends: template-scala-3-xignore-scala2-macros
