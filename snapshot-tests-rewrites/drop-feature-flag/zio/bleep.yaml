    extends: template-common
    platform:
      name: jvm
  template-jvm-test-dependencies:
    dependencies:
    - com.google.inject:guice:6.0.0
    - junit:junit:4.13.2
    - org.apache.maven.resolver:maven-resolver-connector-basic:1.9.27
    - org.apache.maven.resolver:maven-resolver-transport-http:1.9.27
    - org.apache.maven:maven-compat:3.9.16
    - org.apache.maven:maven-embedder:3.9.16
    - org.codehaus.plexus:plexus-component-annotations:2.2.0
    - org.eclipse.sisu:org.eclipse.sisu.inject:1.1.0
    - org.scala-lang.modules::scala-xml:2.5.0
    - org.slf4j:slf4j-simple:2.0.20
