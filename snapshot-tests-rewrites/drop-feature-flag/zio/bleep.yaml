    - template-jvm-test-dependencies
    - template-jvm-test-project.dir
    - template-scala-2-xfatal-warnings
    - template-scala-2.13
    platform:
      jvmOptions: -Dscala.compat.version=2.13 -Dscala.version=2.13.18
  template-scala-2.13-native:
    extends:
    - template-native
    - template-scala-2-xlint
    - template-scala-2.13
    scala:
      options: -Ybackend-parallelism:4
  template-scala-3:
    extends: template-scala-2.13-and-3
    scala:
      version: 3.3.8
  template-scala-3-xignore-scala2-macros:
    extends:
    - template-common-deprecation
    - template-scala-3
    scala:
      options: -Xignore-scala2-macros -Xmax-inlines:64 -language:implicitConversions
        -language:noAutoTupling -noindent
