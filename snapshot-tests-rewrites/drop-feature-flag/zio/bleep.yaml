templates:
  template-common:
    ignoreEvictionErrors: no
    scala:
      setup:
        order: mixed
  template-common-deprecation:
    extends: template-common
    scala:
      options: -deprecation -encoding UTF-8 -release 11 -unchecked
  template-common-main:
    extends: template-common
    publish:
      groupId: dev.zio
    sbt-scope: main
  template-common-test:
    extends: template-common
    isTestProject: true
    sbt-scope: test
    testFrameworks:
    - hedgehog.sbt.Framework
    - weaver.framework.CatsEffect
    - zio.test.sbt.ZTestFramework
  template-common-test-jcstress-core:
    dependencies:
    - net.sf.jopt-simple:jopt-simple:4.6
    - org.openjdk.jcstress:jcstress-core:0.3
    extends: template-common-test
  template-cross-all:
    cross:
      js212:
        extends:
        - template-js
        - template-scala-2-xfatal-warnings
        - template-scala-2.12
      js213:
        extends: template-scala-2.13-js
      js3:
        extends:
        - template-js
        - template-scala-3-xignore-scala2-macros
      jvm212:
        extends:
        - template-jvm
        - template-scala-2-xfatal-warnings
        - template-scala-2.12
      jvm213:
        extends:
        - template-jvm
        - template-scala-2-xfatal-warnings
        - template-scala-2.13
        scala:
          options: -Ybackend-parallelism:4
      jvm3:
        extends:
        - template-jvm
        - template-scala-3-xignore-scala2-macros
      native212:
        extends:
        - template-native
        - template-scala-2-xfatal-warnings
        - template-scala-2.12
      native213:
        extends:
        - template-scala-2-xfatal-warnings
        - template-scala-2.13-native
      native3:
        extends:
        - template-native
        - template-scala-3-xignore-scala2-macros
  template-cross-js-212-213-jvm-212-213-native-212-213:
    cross:
      js212:
        extends: template-scala-2-scala-compiler
      js213:
        extends: template-scala-2-scala-compiler
      jvm212:
        extends: template-scala-2-scala-compiler
      jvm213:
        extends: template-scala-2-scala-compiler
      native212:
        extends: template-scala-2-scala-compiler
      native213:
        extends: template-scala-2-scala-compiler
  template-cross-js-all-jvm-all:
    cross:
      js212:
        extends:
        - template-js
        - template-scala-2-xfatal-warnings
        - template-scala-2.12
      js213:
        extends: template-scala-2.13-js
      js3:
        extends:
        - template-js
        - template-scala-3-xignore-scala2-macros
      jvm212:
