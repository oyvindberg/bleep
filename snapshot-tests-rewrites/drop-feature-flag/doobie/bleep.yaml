$schema: https://raw.githubusercontent.com/oyvindberg/bleep/master/schema.json
$version: dev
jvm:
  name: temurin:17
projects:
  bench:
    dependencies:
    - org.openjdk.jmh:jmh-core:1.37
    - org.openjdk.jmh:jmh-generator-bytecode:1.37
    - org.openjdk.jmh:jmh-generator-reflection:1.37
    dependsOn:
    - doobie-hikari
    - doobie-postgres
    extends:
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/modules/bench
  doobie-core:
    cross:
      jvm212:
        dependencies:
        - com.chuusai::shapeless:2.3.13
        - org.scala-lang.modules::scala-collection-compat:2.13.0
        sources: ./src/${SCOPE}/scala-2.13-
      jvm213:
        dependencies: com.chuusai::shapeless:2.3.13
        sources: ./src/${SCOPE}/scala-2.13+
      jvm3:
        sources: ./src/${SCOPE}/scala-2.13+
    dependencies: org.tpolecat::typename:1.1.0
    dependsOn: doobie-free
    extends:
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/modules/core
    sourcegen:
      main: scripts.CopyImportedGeneratedFiles
      project: scripts
  doobie-core-test:
    dependencies:
    - com.h2database:h2:1.4.200
    - org.postgresql:postgresql:42.7.5
    dependsOn:
    - doobie-core
    - testutils-test
    extends:
    - template-common-test
    - template-cross-all
    folder: ../sbt-build/modules/core
  doobie-free:
    cross:
      jvm212:
        dependencies: org.scala-lang:scala-reflect:${SCALA_VERSION}
      jvm213:
        dependencies: org.scala-lang:scala-reflect:${SCALA_VERSION}
    dependencies:
    - co.fs2::fs2-core:3.12.0
    - org.typelevel::cats-core:2.13.0
    - org.typelevel::cats-effect:3.6.1
    - org.typelevel::cats-free:2.13.0
    extends:
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/modules/free
  doobie-free-test:
    dependsOn: doobie-free
    extends:
    - template-common-test-dependencies
    - template-cross-all
    folder: ../sbt-build/modules/free
  doobie-h2:
    dependencies: com.h2database:h2:1.4.200
    dependsOn: doobie-core
    extends:
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/modules/h2
  doobie-h2-circe:
    dependencies:
    - io.circe::circe-core:0.14.12
    - io.circe::circe-parser:0.14.12
    dependsOn: doobie-h2
    extends:
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/modules/h2-circe
  doobie-h2-circe-test:
    dependsOn: doobie-h2-circe
    extends:
    - template-common-test-dependencies
    - template-cross-all
    folder: ../sbt-build/modules/h2-circe
  doobie-h2-test:
    dependsOn:
    - doobie-core-test
    - doobie-h2
    extends:
    - template-common-test
    - template-cross-all
    folder: ../sbt-build/modules/h2
  doobie-hikari:
    cross:
      jvm212:
        extends: template-scala-2.12
      jvm213:
        extends: template-doobie-hikari-scala-2.13
      jvm3:
        extends: template-scala-3
    dependencies:
    - exclusions:
        org.slf4j: slf4j-api
      module: com.zaxxer:HikariCP:6.3.0
    - org.slf4j:slf4j-api:1.7.36
    dependsOn: doobie-core
    extends: template-common-main
    folder: ../sbt-build/modules/hikari
  doobie-hikari-test:
    cross:
      jvm212:
        extends: template-scala-2.12
      jvm213:
        extends: template-doobie-hikari-scala-2.13
      jvm3:
        extends: template-scala-3
    dependencies:
    - com.h2database:h2:1.4.200
    - org.slf4j:slf4j-nop:1.7.36
    dependsOn:
    - doobie-hikari
    - doobie-postgres
    extends: template-common-test-dependencies
    folder: ../sbt-build/modules/hikari
  doobie-log4cats:
    dependencies: org.typelevel::log4cats-core:2.7.0
    dependsOn: doobie-core
    extends:
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/modules/log4cats
  doobie-munit:
    dependencies: org.scalameta::munit:1.1.0
    dependsOn: doobie-core
    extends:
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/modules/munit
  doobie-munit-test:
    dependencies: com.h2database:h2:1.4.200
    dependsOn: doobie-munit
    extends:
    - template-common-test-dependencies
    - template-cross-all
    folder: ../sbt-build/modules/munit
  doobie-mysql:
    dependencies: com.mysql:mysql-connector-j:9.2.0
    dependsOn: doobie-core
    extends:
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/modules/mysql
  doobie-mysql-test:
    dependsOn:
    - doobie-core-test
    - doobie-mysql
    extends:
    - template-common-test
    - template-cross-all
    folder: ../sbt-build/modules/mysql
  doobie-postgres:
    dependencies:
    - co.fs2::fs2-io:3.12.0
    - configuration: provided
      module: net.postgis:postgis-jdbc:2024.1.0
    - org.postgresql:postgresql:42.7.5
    dependsOn: doobie-core
    extends:
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/modules/postgres
  doobie-postgres-circe:
    dependencies:
    - io.circe::circe-core:0.14.12
    - io.circe::circe-parser:0.14.12
    dependsOn: doobie-postgres
    extends:
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/modules/postgres-circe
  doobie-postgres-circe-test:
    dependsOn: doobie-postgres-circe
    extends:
    - template-common-test-dependencies
    - template-cross-all
    folder: ../sbt-build/modules/postgres-circe
  doobie-postgres-test:
    cross:
      jvm213:
        dependencies: org.scala-lang.modules::scala-collection-compat:2.13.0
      jvm3:
        dependencies: org.scala-lang.modules::scala-collection-compat:2.13.0
    dependencies:
      configuration: provided
      module: net.postgis:postgis-jdbc:2024.1.0
    dependsOn:
    - doobie-core-test
    - doobie-postgres
    extends:
    - template-common-test
    - template-cross-all
    folder: ../sbt-build/modules/postgres
  doobie-refined:
    dependencies: eu.timepit::refined:0.11.3
    dependsOn: doobie-core
    extends:
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/modules/refined
  doobie-refined-test:
    dependencies: com.h2database:h2:1.4.200
    dependsOn: doobie-refined
    extends:
    - template-common-test-dependencies
    - template-cross-all
    folder: ../sbt-build/modules/refined
  doobie-scalatest:
    dependencies: org.scalatest::scalatest:3.2.18
    dependsOn: doobie-core
    extends:
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/modules/scalatest
  doobie-scalatest-test:
    dependencies: com.h2database:h2:1.4.200
    dependsOn: doobie-scalatest
    extends:
    - template-common-test-dependencies
    - template-cross-all
    folder: ../sbt-build/modules/scalatest
  doobie-specs2:
    dependencies: org.specs2::specs2-core:4.21.0
    dependsOn: doobie-core
    extends:
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/modules/specs2
  doobie-specs2-test:
    dependsOn:
    - doobie-h2
    - doobie-specs2
    - testutils-test
    extends:
    - template-common-test
    - template-cross-all
    folder: ../sbt-build/modules/specs2
  doobie-weaver:
    dependencies: com.disneystreaming::weaver-cats:0.8.4
    dependsOn: doobie-core
    extends:
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/modules/weaver
  doobie-weaver-test:
    dependencies: com.h2database:h2:1.4.200
    dependsOn: doobie-weaver
    extends:
    - template-common-test-dependencies
    - template-cross-all
    folder: ../sbt-build/modules/weaver
  example:
    dependsOn:
    - doobie-h2
    - doobie-hikari
    - doobie-postgres
    - doobie-scalatest
    - doobie-specs2
    extends:
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/modules/example
  example-test:
    dependsOn:
    - example
    - testutils-test
    extends:
    - template-common-test
    - template-cross-all
    folder: ../sbt-build/modules/example
  scripts:
    dependencies: build.bleep:bleepscript:1.0.0-M14
    platform:
      name: jvm
    resources: ./resources
  testutils:
    extends:
    - template-common-main
    - template-cross-all
    folder: ../sbt-build/modules/testutils
  testutils-test:
    dependsOn: testutils
    extends:
    - template-common-test-dependencies
    - template-cross-all
    folder: ../sbt-build/modules/testutils
templates:
  template-common:
    ignoreEvictionErrors: no
    platform:
      name: jvm
    scala:
      options: -Wconf:cat=unused-nowarn:s
      setup:
        order: mixed
  template-common-main:
    extends: template-common
    publish:
      groupId: org.tpolecat
    sbt-scope: main
  template-common-test:
    extends: template-common
    isTestProject: true
    sbt-scope: test
    testFrameworks:
    - hedgehog.sbt.Framework
    - weaver.framework.CatsEffect
    - zio.test.sbt.ZTestFramework
  template-common-test-dependencies:
    dependencies:
    - org.typelevel::cats-effect-testkit:3.6.1
    - org.typelevel::munit-cats-effect:2.1.0
    - org.typelevel::scalacheck-effect-munit:2.0.0-M2
    extends: template-common-test
  template-cross-all:
    cross:
      jvm212:
        extends: template-scala-2.12
      jvm213:
        extends:
        - template-scala-2-strict
        - template-scala-2.13
      jvm3:
        extends: template-scala-3
  template-doobie-hikari-scala-2.13:
    extends:
    - template-scala-2.13
    - template-scala-2.13-and-3-wnonunit-statement
    scala:
      options: -Wdead-code -Wextra-implicit -Wnumeric-widen -Wunused:patvars -Xlint:-byname-implicit
        -Xlint:adapted-args -Xlint:constant -Xlint:delayedinit-select -Xlint:deprecation
        -Xlint:doc-detached -Xlint:implicit-not-found -Xlint:implicit-recursion -Xlint:inaccessible
        -Xlint:infer-any -Xlint:missing-interpolator -Xlint:nullary-unit -Xlint:option-implicit
        -Xlint:package-object-classes -Xlint:poly-implicit-overload -Xlint:private-shadow
        -Xlint:stars-align -Xlint:strict-unsealed-patmat -Xlint:type-parameter-shadow
        -language:existentials
  template-scala-2:
    extends: template-common
    scala:
      compilerPlugins:
      - com.olegpy::better-monadic-for:0.3.1
      - org.typelevel:::kind-projector:0.13.3
      options: -Xsource:3
  template-scala-2-strict:
    extends: template-scala-2
    scala:
      strict: true
  template-scala-2.12:
    extends: template-scala-2-strict
    scala:
      version: 2.12.20
  template-scala-2.13:
    extends:
    - template-scala-2
    - template-scala-2.13-and-3
    scala:
      version: 2.13.16
  template-scala-2.13-and-3:
    extends: template-common
    scala:
      options: -language:higherKinds
      setup:
        addLibraryToBootClasspath: false
        filterLibraryFromClasspath: false
        manageBootClasspath: false
  template-scala-2.13-and-3-wnonunit-statement:
    extends: template-scala-2.13-and-3
    scala:
      options: -Wnonunit-statement -Wunused:explicits -Wunused:implicits -Wunused:imports
        -Wunused:locals -Wunused:params -Wunused:privates -Wvalue-discard -encoding
        utf8 -language:experimental.macros -language:implicitConversions -unchecked
  template-scala-3:
    extends: template-scala-2.13-and-3-wnonunit-statement
    scala:
      options: -Xmax-inlines 64 -Ykind-projector -deprecation -language:adhocExtensions
        -source:future
      version: 3.3.5
